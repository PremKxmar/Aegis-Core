# Local development stack for Aegis Core.
#
# Milestone 1 brings up the two pieces of infrastructure the platform is built on: PostgreSQL
# and Kafka. The services themselves, Prometheus and Grafana join this file as they are built.
#
#   make up      start and wait until both are genuinely accepting connections
#   make down    stop and delete the volumes

name: aegis-core

services:
  postgres:
    image: postgres:17.10
    container_name: aegis-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # The three service databases are created by the init script rather than here, because
      # POSTGRES_DB only ever creates one.
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Scripts in this directory run once, on first startup of an empty data volume.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -U postgres avoids the false "ready" that pg_isready reports for the wrong role, and
      # the check runs against the server socket, not just the process.
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  kafka:
    image: apache/kafka:4.1.2
    container_name: aegis-kafka
    ports:
      # 29092 is the listener for processes on the host (your IDE, a local gradle bootRun).
      # Containers on this network use kafka:9092 instead.
      - "29092:29092"
    environment:
      # Single-node KRaft: this container is both broker and controller, so there is no
      # ZooKeeper to run or explain.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # A single broker cannot replicate anything; the defaults of 3 would leave the internal
      # topics permanently under-replicated and consumer group coordination would never start.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Zero rebalance delay: in production this batches joining consumers to avoid repeated
      # rebalances, but locally it is three seconds of waiting on every restart.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Asking the broker to list topics proves the API is actually serving, which a TCP port
      # check does not.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

volumes:
  postgres-data:
  kafka-data:
