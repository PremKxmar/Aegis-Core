spring:
  application:
    name: rating-service

  datasource:
    url: ${RATING_DB_URL:jdbc:postgresql://localhost:5432/aegis_rating}
    username: ${RATING_DB_USER:rating_svc}
    password: ${RATING_DB_PASSWORD:rating_svc}
    hikari:
      pool-name: rating-pool
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8082
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
