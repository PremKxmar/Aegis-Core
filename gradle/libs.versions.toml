# Single source of truth for dependency versions.
#
# Deliberately small: anything covered by the Spring Boot BOM (JUnit, AssertJ, Jackson,
# Kafka clients, Testcontainers, Flyway, PostgreSQL driver, Micrometer) is NOT pinned here.
# Pinning those would silently override Boot's tested combination and is a classic source of
# "works on my machine" dependency drift.

[versions]
java = "21"
springBoot = "3.5.16"
springDependencyManagement = "1.1.7"
spotless = "8.9.0"
spotbugsPlugin = "6.5.10"
spotbugsTool = "4.10.3"
palantirJavaFormat = "2.97.0"
jacoco = "0.8.15"

# springdoc 2.x is the Spring Boot 3.x line; 3.x targets Boot 4 and will not start here.
springdoc = "2.9.0"
jqwik = "1.10.1"
# 3.x pulls a swagger-parser that collides with the one springdoc 2.x brings in.
swaggerRequestValidator = "2.46.1"
resilience4j = "2.4.0"
logstashEncoder = "9.0"

[libraries]
spotbugs-annotations = { module = "com.github.spotbugs:spotbugs-annotations", version.ref = "spotbugsTool" }
springdoc-openapi-webmvc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
swagger-request-validator-core = { module = "com.atlassian.oai:swagger-request-validator-core", version.ref = "swaggerRequestValidator" }
resilience4j-spring-boot3 = { module = "io.github.resilience4j:resilience4j-spring-boot3", version.ref = "resilience4j" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstashEncoder" }

# Gradle plugins consumed as ordinary dependencies by `buildSrc` so that the convention
# plugins in buildSrc/src/main/kotlin can apply them by id.
plugin-spring-boot = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "springBoot" }
plugin-spring-dependency-management = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "springDependencyManagement" }
plugin-spotless = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
plugin-spotbugs = { module = "com.github.spotbugs:com.github.spotbugs.gradle.plugin", version.ref = "spotbugsPlugin" }
